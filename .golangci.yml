# Lint configuration. See D10 in docs/decisions/.
#
# The posture is `default: all` with a disable list, as in dburl, dbmeta and
# cql. A new linter that arrives in a release gets a look rather than
# silence. The version is pinned in the workflow, so an upgrade cannot turn on
# a linter that nobody chose.
#
# The rule for a finding: a linter that makes idiomatic Go worse is disabled
# here, with the reason beside it. Only a real defect gets a code change. A
# change made only to quiet a linter is itself a defect.
#
# Two hard rules in AGENTS.md are held here rather than by review. depguard
# keeps the dependencies to the standard library and apd (D13). forbidigo bans
# context.Background, context.TODO and the database/sql calls that take no
# context (D8).
version: "2"

run:
  modules-download-mode: readonly

linters:
  default: all
  disable:
    # Layout and naming rules that fight idiomatic Go. Short names such as db,
    # c and s are the convention for a receiver or a local with a small scope.
    - lll
    - nlreturn
    - varnamelen
    - wsl
    - wsl_v5
    # A struct literal names the fields it sets, and no more.
    - exhaustruct
    - exhaustruct_v5
    # Complexity metrics. A decoder for the types of one product is one
    # switch, and splitting the switch hides the table.
    - cyclop
    - funlen
    - gocognit
    - gocyclo
    - maintidx
    - nestif
    # A switch names the cases it handles and answers the rest after the
    # switch. The remedy this linter wants is an empty case, which says less.
    - exhaustive
    # A driver registers itself from init, as every database/sql driver does.
    - gochecknoinits
    - gochecknoglobals
    # A sentinel error is a constant of a defined string type (D6), which
    # err113 cannot test.
    - err113
    # An error is wrapped once, where the context is known. Wrapping an error
    # from database/sql again destroys nothing, but wrapcheck asks for it at
    # every return.
    - wrapcheck
    # A NULL is nil and needs no error (D8).
    - nilnil
    # `if err := f(); err != nil` is idiomatic Go.
    - noinlineerr
    # SQL repeats on purpose, and `SELECT a, a` is a column list, not a typo.
    - goconst
    - dupword
    # prealloc rewrites readable loops for a gain that nothing has measured.
    - prealloc
    # depguard holds the dependency rule, and holding it twice means two
    # places to change it. gomodguard is also deprecated.
    - gomodguard
    - gomodguard_v2
    # A driver hands the body of a response to dbimp.Stream, which closes it
    # when the rows close (D36). bodyclose cannot follow the body into the
    # Stream, so it fires on every driver.
    - bodyclose
    # A timeout, a buffer size or an offset in a parser is named at the one
    # place that sets it. A constant for each 2 in the parser for
    # placeholders reads worse than the 2. dbmeta disables it too.
    - mnd

  settings:
    # Hard rule 6 and D13. The module imports the standard library, apd for
    # decimals (D33), and nothing else. A binary encoding that Ken approves
    # for one database is added here.
    depguard:
      rules:
        main:
          list-mode: strict
          allow:
            - $gostd
            - github.com/xo/dbimp
            - github.com/cockroachdb/apd/v3
    # Hard rule 4, and the database/sql half of D8.
    forbidigo:
      analyze-types: true
      forbid:
        - pattern: ^context\.(Background|TODO)$
          msg: take the context from the caller, never make one here
        - pattern: ^\(\*database/sql\.(DB|Conn|Tx|Stmt)\)\.(Query|Exec|QueryRow|Prepare)$
          msg: use the Context form, such as QueryContext
    # A function that returns its type parameter, such as dbimp.Resolve,
    # returns the concrete type of the caller, and no interface. The rest is
    # the default of ireturn.
    ireturn:
      allow:
        - anon
        - error
        - empty
        - stdlib
        - generic
    # A deferred Close has nothing left to report after the code read Err. Wrapping the defer in a closure to discard it reads worse.
    errcheck:
      exclude-functions:
        - (*database/sql.DB).Close
        - (*database/sql.Rows).Close
        - (*database/sql.Stmt).Close
        # The body of a response, closed after the part that matters was read.
        - (io.ReadCloser).Close
        - (io.Closer).Close
        # The rows of a driver, closed in a defer after the part that
        # matters was read, as with the body.
        - (*github.com/xo/dbimp/couchbase.rows).Close
        - (*github.com/xo/dbimp/surrealdb.rows).Close
        - (*github.com/xo/dbimp/neo4j.rows).Close
        - (*github.com/xo/dbimp/databend.rows).Close
        - (database/sql/driver.Rows).Close
        # The stream of a body, closed after the part that matters was read.
        - (*github.com/xo/dbimp.Stream).Close
        # A deferred close of a connection that a test took from the pool.
        - (*database/sql.Conn).Close
        # A deferred rollback after a commit returns sql.ErrTxDone, and a
        # test has nothing to do with that.
        - (*database/sql.Tx).Rollback
    gosec:
      excludes:
        # errcheck holds the rule for an error that is not checked, with the
        # list above. G104 holds it again without the list.
        - G104
        # A driver sends each request to the host that its caller named in the
        # DSN. That is the product, not a forged request.
        - G704
    errorlint:
      errorf: true
      asserts: true
      comparison: true
    revive:
      rules:
        # A test helper takes *testing.T first, and the context after it.
        - name: context-as-argument
          arguments:
            - allowTypesBefore: "*testing.T"
        - name: error-naming
        - name: error-return
        - name: error-strings
        - name: exported
        - name: indent-error-flow
        - name: package-comments
        - name: receiver-naming
        - name: var-naming

  exclusions:
    rules:
      # SurrealDB walks an answer in CBOR and in JSON with the same text, each
      # with its own decoder, and not through an interface of each token
      # (D108). TestTheWalksAreAlike holds that the two stay the same.
      - path: surrealdb/(cbor|json)sets\.go
        linters:
          - dupl
      # A test builds its own context and does not answer to the context
      # rule. Neither does the main function of a command, which is where the
      # context of a program starts.
      - path: (_test\.go|/cmd/)
        linters:
          - forbidigo
      # The tests of the documents, the skills and the gates read the files of
      # this repository, which they find by walking the repository itself.
      # The gate tests write a repository of their own to test the gates.
      - path: (docs|skills|gates|gates_self)_test\.go
        linters:
          - gosec
        text: G30[146]
      # The test helpers read and write the files under testdata/, which the
      # test names and which are committed, so any reader can read them.
      - path: dbimptest/
        linters:
          - gosec
        text: G30[146]|G703
      # A test in dbimptest counts the goroutines of the process, or sets an
      # environment variable, so it must not run in parallel.
      - path: dbimptest/.*_test\.go
        linters:
          - paralleltest
      # The integration tests of a driver share one server and the scope that
      # TestMain makes, and run in order. A body that runs once for each
      # principal takes *testing.T and is a test, not a helper.
      - path: integration_test\.go
        linters:
          - paralleltest
          - thelper
      # A test builds a statement from the name of the scope or the table that
      # it made, and holds text in other scripts on purpose, and sends SELECT
      # * as a person does, to test the star signature. G701 is the same
      # finding by taint analysis. A test reads the recordings under
      # testdata/ by the names that it found there, and copies them into a
      # folder of its own (G703).
      - path: _test\.go
        linters:
          - gosec
        text: G202|G701|G703
      - path: _test\.go
        linters:
          - gosmopolitan
          - unqueryvet
      # The tags of the Neo4j driver are the names that the Query API sends,
      # such as _element_id and neo4j_version, which the driver cannot
      # rename.
      - path: neo4j/
        linters:
          - tagliatelle
      # The tags of the InfluxDB driver are the names that the server sends,
      # such as column_name and statement_id, which the driver cannot rename.
      - path: influxdb/
        linters:
          - tagliatelle
      # The tags of the Databend driver are the names that the server sends,
      # such as final_uri and has_result_set, which the driver cannot rename.
      - path: databend/
        linters:
          - tagliatelle
      # The contract reads rows in several shapes, and closes each one in a
      # cleanup of the test, where these linters cannot follow it.
      - path: dbimptest/contract\.go
        linters:
          - rowserrcheck
          - sqlclosecheck

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/xo/dbimp
