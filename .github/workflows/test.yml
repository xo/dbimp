# Tests dbimp on every push and pull request to main, and every night.
#
# The unit and lint jobs need no server. The integration job starts each
# release of each driver with dbrun from a pinned dbmeta commit, and runs the
# integration tests against it (W3 in docs/BACKLOG.md, D9 in docs/decisions/). A
# push runs the releases that dbmeta calls tested, and the nightly run adds the
# ones that it calls nightly. A release that no dbmeta model reads is Staged,
# and its cadence names the tier that it would have (dbmeta D119 and
# dbmeta D120). The workflow names no
# release (dbmeta D69).
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every night, for the releases that dbmeta calls nightly.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # 00d9f72 or later: 2b93710 holds the ordinary Couchbase user
  # (dbmeta D96), ec91128 gives each server an owner (dbmeta D98), eb35c7c
  # prints the URL of each principal (dbmeta D102), 78f1e44 starts SurrealDB with its
  # ordinary user (dbmeta D103), e00d4e7 gives each Staged release its
  # cadence (dbmeta D120), 415e830 prints the URL of D82 for InfluxDB, and
  # 29395a1 prints the URL of D93 for ArangoDB.
  DBMETA_COMMIT: 7907cd9b71c69fe361f0a2602772536189cb2e2c
  DBMETA_OWNER: dbimp-ci
  DBMETA_RUNNER: docker

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # -count=2 finds a registration in a test body, which a second run
      # refuses.
      - name: Test
        run: go test -race -count=2 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned, because .golangci.yml sets default: all and a newer release
      # can turn on a linter that nobody chose (D10).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Lint
        run: golangci-lint run ./...

  releases:
    name: Releases
    runs-on: ubuntu-latest
    outputs:
      names: ${{ steps.list.outputs.names }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: xo/dbmeta
          ref: ${{ env.DBMETA_COMMIT }}
          path: dbmeta
      - uses: actions/setup-go@v7
        with:
          go-version-file: dbmeta/test/go.mod
          cache-dependency-path: dbmeta/test/go.sum
      # A driver has the name of its product (D30), and each driver has a
      # folder under testdata/, so the products come from there. A product
      # that a dbmeta model reads is in the tiers tested and nightly, and any
      # other is Staged, with the tier that it would have as its cadence
      # (dbmeta D120). A product with no release fails the job, so that a
      # change in dbmeta never drops the tests of a driver without a word.
      - name: List
        id: list
        run: |
          cadences='["tested"]'
          if [ "${{ github.event_name }}" = schedule ]; then
            cadences='["tested","nightly"]'
          fi
          tiers=$(echo "$cadences" | jq -r 'join(" ")')
          products=$(ls -d testdata/*/ | xargs -n1 basename | jq -R . | jq -sc .)
          list=$(cd dbmeta/test && go run ./cmd/dbrun list --json $tiers staged)
          names=$(echo "$list" | jq -c --argjson products "$products" --argjson cadences "$cadences"             '[.[] | select(.product as $p | $products | index($p))
              | select(.tier != "staged" or (.cadence as $c | $cadences | index($c))) | .name] | unique')
          missing=$(echo "$names" | jq -r --argjson products "$products"             '. as $names | $products[] | select(. as $p | [$names[] | startswith($p + "-")] | any | not)')
          if [ -n "$missing" ]; then
            echo "dbrun lists no release to test for: $missing"
            exit 1
          fi
          echo "names=$names" >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.release }}
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.releases.outputs.names) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: xo/dbmeta
          ref: ${{ env.DBMETA_COMMIT }}
          path: dbmeta
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            dbmeta/test/go.sum
      - name: Start ${{ matrix.release }}
        working-directory: dbmeta/test
        run: go run ./cmd/dbrun start ${{ matrix.release }}
      # The url field is the DSN of the driver, the scheme of which is the
      # name of the driver (D27). <PRODUCT>_DSN is the administrator, and
      # <PRODUCT>_ORDINARY_DSN is the ordinary user that dbmeta makes (D9),
      # which dbrun names with the role "user" (dbmeta D102).
      - name: Test
        run: |
          info=$(cd dbmeta/test && go run ./cmd/dbrun dsn --json ${{ matrix.release }})
          product=$(echo "$info" | jq -r '.[0].product')
          prefix=$(echo "$product" | tr '[:lower:]' '[:upper:]')
          export "${prefix}_DSN=$(echo "$info" | jq -r '.[0].url')"
          export "${prefix}_ORDINARY_DSN=$(echo "$info" | jq -r '[.[0].principals[]? | select(.role == "user") | .url][0] // empty')"
          go test -race -count=1 -run Integration -v "./$product/..."
      - name: Logs
        if: failure()
        working-directory: dbmeta/test
        run: go run ./cmd/dbrun logs ${{ matrix.release }}
      - name: Remove ${{ matrix.release }}
        if: always()
        working-directory: dbmeta/test
        run: go run ./cmd/dbrun remove ${{ matrix.release }}
