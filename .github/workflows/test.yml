# Tests dbimp on every push and pull request to main, and every night.
#
# The unit and lint jobs need no server. The integration job starts each
# release of each driver with dbrun from a pinned dbmeta commit, and runs the
# integration tests against it (W3 in docs/BACKLOG.md, D9 in docs/decisions/). A
# push runs the releases that dbmeta calls tested, and the nightly run adds the
# ones that it calls nightly. A release that no dbmeta model reads is Staged,
# and its cadence names the tier that it would have (dbmeta D119 and
# dbmeta D120). The workflow names no
# release (dbmeta D69).
name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Every night, for the releases that dbmeta calls nightly.
    - cron: "41 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  # a59c0c1 or later: 2b93710 holds the ordinary Couchbase user
  # (dbmeta D96), ec91128 gives each server an owner (dbmeta D98), eb35c7c
  # prints the URL of each principal (dbmeta D102), 78f1e44 starts SurrealDB with its
  # ordinary user (dbmeta D103), e00d4e7 gives each Staged release its
  # cadence (dbmeta D120), 415e830 prints the URL of D82 for InfluxDB,
  # 29395a1 prints the URL of D93 for ArangoDB, 7907cd9 prints the URL of
  # D117 for Databend, 6b24b13 prints the URL of D129 for Pinot and the
  # address of its Controller as secondAddress, and f7e3cbb prints the URL
  # of D141 for rqlite, 9b691b3 gives the InfluxDB 3 entry the URL of D82 as
  # its dsn, b868c8d gives the libSQL entry an ordinary user through a JWT,
  # and a59c0c1 prints the URL of D148 for libSQL. dd70b7a is the release
  # v0.1.0 of dbmeta, which also prints the field api, the http:// address
  # (dbmeta D167). The ClickHouse tests need a later commit that publishes
  # the HTTP port 8123 of ClickHouse as secondAddress and makes the user
  # dbmeta_user (W32 and docs/CLICKHOUSE.md, Open questions). Those changes
  # were staged in dbmeta and not committed when the driver was written, so
  # move this pin to the commit that holds them before the first run.
  DBMETA_COMMIT: dd70b7a7e7105c64cafa98c0f3100a8effb0da8d
  DBMETA_OWNER: dbimp-ci
  DBMETA_RUNNER: docker

jobs:
  unit:
    name: Unit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)"
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build ./...
      # -count=2 finds a registration in a test body, which a second run
      # refuses.
      - name: Test
        run: go test -race -count=2 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # Pinned, because .golangci.yml sets default: all and a newer release
      # can turn on a linter that nobody chose (D10).
      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.13.2
      - name: Lint
        run: golangci-lint run ./...

  releases:
    name: Releases
    runs-on: ubuntu-latest
    outputs:
      releases: ${{ steps.list.outputs.releases }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: xo/dbmeta
          ref: ${{ env.DBMETA_COMMIT }}
          path: dbmeta
      - uses: actions/setup-go@v7
        with:
          go-version-file: dbmeta/test/go.mod
          cache-dependency-path: dbmeta/test/go.sum
      # A driver has the name of its product (D30), and each driver has a
      # folder under testdata/ and a package folder of the same name. A
      # folder under testdata/ with no package folder holds the recordings
      # of a driver that is not written yet, and has no test to run. A
      # driver also tests each other product of a
      # release that its manifest recorded, such as phoenix for avatica,
      # whose name is not the name of a driver (D161). A product that a
      # dbmeta model reads is in the tiers tested and nightly, and any other
      # is Staged, with the tier that it would have as its cadence (dbmeta
      # D120). A driver with no release fails the job, so that a change in
      # dbmeta never drops the tests of a driver without a word.
      - name: List
        id: list
        run: |
          cadences='["tested"]'
          if [ "${{ github.event_name }}" = schedule ]; then
            cadences='["tested","nightly"]'
          fi
          tiers=$(echo "$cadences" | jq -r 'join(" ")')
          drivers=$(for d in testdata/*/; do d=$(basename "$d"); if [ -d "$d" ]; then echo "$d"; fi; done | jq -R . | jq -sc .)
          list=$(cd dbmeta/test && go run ./cmd/dbrun list --json $tiers staged)
          recorded=$(for d in $(echo "$drivers" | jq -r '.[]'); do
            jq -c --arg d "$d" '[.entries[].release | {release: ., driver: $d}]' "testdata/$d/manifest.json"
          done | jq -sc 'add | unique')
          owners=$(echo "$list" | jq -c --argjson drivers "$drivers" --argjson recorded "$recorded" \
            '[$drivers[] | {product: ., driver: .}] + [.[] as $e | $recorded[] | select(.release == $e.name) | {product: $e.product, driver}] | unique')
          releases=$(echo "$list" | jq -c --argjson owners "$owners" --argjson cadences "$cadences" \
            '[.[] | . as $e | $owners[] | select(.product == $e.product)
              | select($e.tier != "staged" or ($e.cadence as $c | $cadences | index($c)))
              | {release: $e.name, driver}] | unique')
          missing=$(echo "$releases" | jq -r --argjson drivers "$drivers" \
            '. as $r | $drivers[] | select(. as $d | [$r[] | .driver == $d] | any | not)')
          if [ -n "$missing" ]; then
            echo "dbrun lists no release to test for: $missing"
            exit 1
          fi
          echo "releases=$releases" >> "$GITHUB_OUTPUT"

  integration:
    name: ${{ matrix.release }}
    needs: releases
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.releases.outputs.releases) }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: xo/dbmeta
          ref: ${{ env.DBMETA_COMMIT }}
          path: dbmeta
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            dbmeta/test/go.sum
      - name: Start ${{ matrix.release }}
        working-directory: dbmeta/test
        run: go run ./cmd/dbrun start ${{ matrix.release }}
      # The url field is the DSN of the driver, the scheme of which is the
      # name of the driver (D27). <DRIVER>_DSN is the administrator, and
      # <DRIVER>_ORDINARY_DSN is the ordinary user that dbmeta makes (D9),
      # which dbrun names with the role "user" (dbmeta D102).
      # <DRIVER>_SECOND_ADDRESS is the second port of the entry, as
      # host:port, such as the Controller of Pinot, through which its tests
      # make their tables (D128), and empty for a product that has none.
      # The prefix is the name of the driver and not of the product, so that
      # the tests of avatica read AVATICA_DSN on phoenix too (D161).
      - name: Test
        run: |
          info=$(cd dbmeta/test && go run ./cmd/dbrun dsn --json ${{ matrix.release }})
          driver=${{ matrix.driver }}
          prefix=$(echo "$driver" | tr '[:lower:]' '[:upper:]')
          export "${prefix}_DSN=$(echo "$info" | jq -r '.[0].url')"
          export "${prefix}_ORDINARY_DSN=$(echo "$info" | jq -r '[.[0].principals[]? | select(.role == "user") | .url][0] // empty')"
          export "${prefix}_SECOND_ADDRESS=$(echo "$info" | jq -r '.[0].secondAddress // empty')"
          # A run of the schedule or a manual run reads every type of a
          # round trip that is slow, and a push reads a few (D172).
          if [ "${{ github.event_name }}" = schedule ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then
            export DBIMP_FULL=1
          fi
          go test -race -count=1 -timeout 150m -run Integration -v "./$driver/..."
      - name: Logs
        if: failure()
        working-directory: dbmeta/test
        run: go run ./cmd/dbrun logs ${{ matrix.release }}
      - name: Remove ${{ matrix.release }}
        if: always()
        working-directory: dbmeta/test
        run: go run ./cmd/dbrun remove ${{ matrix.release }}
